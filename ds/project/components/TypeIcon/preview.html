<!-- @dsCard group="Fundamentos" height=150 subtitle="Os oito ícones de tipo, em SVG ou Path2D." -->
<div class="gr-root" style="padding:16px;min-height:100%;">
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:12px;text-align:center">
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-npc)"><i data-gr-icon="npc"></i></span><span class="ui-small" style="color:var(--ink-200)">NPC</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-local)"><i data-gr-icon="local"></i></span><span class="ui-small" style="color:var(--ink-200)">Local</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-artefato)"><i data-gr-icon="artefato"></i></span><span class="ui-small" style="color:var(--ink-200)">Artefato</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-item)"><i data-gr-icon="item"></i></span><span class="ui-small" style="color:var(--ink-200)">Item mágico</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-lore)"><i data-gr-icon="lore"></i></span><span class="ui-small" style="color:var(--ink-200)">Lore</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-faccao)"><i data-gr-icon="faccao"></i></span><span class="ui-small" style="color:var(--ink-200)">Facção</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-sessao)"><i data-gr-icon="sessao"></i></span><span class="ui-small" style="color:var(--ink-200)">Sessão</span></div>
  <div style="display:grid;justify-items:center;gap:8px"><span class="gr-type-badge" style="--c:var(--type-outro)"><i data-gr-icon="outro"></i></span><span class="ui-small" style="color:var(--ink-200)">Outro</span></div>
</div>
<div style="display:flex;gap:16px;margin-top:20px;font-size:20px;color:var(--ink-200)">
  <i data-gr-icon="search"></i><i data-gr-icon="plus"></i><i data-gr-icon="close"></i><i data-gr-icon="link"></i><i data-gr-icon="warn"></i><i data-gr-icon="chevron"></i><i data-gr-icon="upload"></i><i data-gr-icon="download"></i>
</div>
</div>
<script>Grimorio.renderIcons();</script>
