<!-- @dsCard group="Painel" height=620 subtitle="O painel da nota, com borda do tipo." -->
<div class="gr-root" style="padding:16px;min-height:100%;">
<div class="gr-panel" style="--c:var(--type-local);max-width:420px">
  <div class="gr-panel-head">
    <span class="gr-type-badge"><i data-gr-icon="local"></i></span>
    <div style="flex:1;min-width:0">
      <input class="gr-title-input" value="Taverna do Javali" aria-label="Título">
      <p class="gr-panel-kicker">Local · em Vila de Brumária</p>
    </div>
    <button class="gr-icon-btn" aria-label="Fechar"><i data-gr-icon="close"></i></button>
  </div>
  <div class="gr-alert"><i data-gr-icon="warn"></i><span>Já existe outra nota chamada <strong>Taverna do Javali</strong>. Os links vão para a primeira.</span></div>
  <div class="gr-row">
    <div><span class="gr-label">Tipo</span><select class="gr-select"><option>Local</option></select></div>
    <div><span class="gr-label">Dentro de</span><select class="gr-select"><option>Vila de Brumária</option></select></div>
  </div>
  <div class="gr-tags"><span class="gr-tag">taverna<button aria-label="Remover">×</button></span><span class="gr-tag">ato-1<button aria-label="Remover">×</button></span><input class="gr-tag-add" placeholder="+ tag"></div>
  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="gr-seg"><button aria-pressed="true">Editar</button><button aria-pressed="false">Visualizar</button></div>
      <span class="gr-hint">Use <code>[[Nome]]</code> para linkar</span>
    </div>
    <textarea class="gr-textarea" style="min-height:110px">Taverna de pedra à beira do rio. [[Orla, a taverneira]] guarda um mapa sob o balcão.</textarea>
  </div>
  <div>
    <h3 class="gr-heading">Citada em <span class="gr-count">2</span></h3>
    <div class="gr-refs">
      <button class="gr-tree-item" style="--c:var(--type-sessao)"><span class="gr-dot"></span><span class="gr-tree-title">Sessão 07: A ponte</span></button>
      <button class="gr-tree-item" style="--c:var(--type-npc)"><span class="gr-dot"></span><span class="gr-tree-title">Capitão Merrow</span></button>
    </div>
  </div>
  <div class="gr-panel-foot"><span>Salvo automaticamente</span><button class="gr-btn gr-btn--danger gr-btn--sm">Excluir nota</button></div>
</div>
</div>
<script>Grimorio.renderIcons();</script>
