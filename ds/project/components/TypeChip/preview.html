<!-- @dsCard group="Navegação" height=120 subtitle="Chips de filtro por tipo (ligado/desligado)." -->
<div class="gr-root" style="padding:16px;min-height:100%;">
<h3 class="gr-heading">Tipos</h3>
<div class="gr-chips" style="max-width:420px">
  <button class="gr-chip" style="--c:var(--type-npc)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="npc"></i></span>NPC <span class="gr-count">14</span></button>
  <button class="gr-chip" style="--c:var(--type-local)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="local"></i></span>Local <span class="gr-count">9</span></button>
  <button class="gr-chip" style="--c:var(--type-artefato)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="artefato"></i></span>Artefato <span class="gr-count">4</span></button>
  <button class="gr-chip" style="--c:var(--type-item)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="item"></i></span>Item mágico <span class="gr-count">6</span></button>
  <button class="gr-chip" style="--c:var(--type-lore)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="lore"></i></span>Lore <span class="gr-count">11</span></button>
  <button class="gr-chip" style="--c:var(--type-faccao)" aria-pressed="true"><span class="gr-chip-mark"><i data-gr-icon="faccao"></i></span>Facção <span class="gr-count">3</span></button>
  <button class="gr-chip" style="--c:var(--type-sessao)" aria-pressed="false"><span class="gr-chip-mark"><i data-gr-icon="sessao"></i></span>Sessão <span class="gr-count">7</span></button>
  <button class="gr-chip" style="--c:var(--type-outro)" aria-pressed="false"><span class="gr-chip-mark"><i data-gr-icon="outro"></i></span>Outro <span class="gr-count">2</span></button>
</div>
</div>
<script>Grimorio.renderIcons();</script>
